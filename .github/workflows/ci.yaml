name: student-api-ci

on:
  push:
    branches:
      - main
    paths:
      - 'student-api/**'
  pull_request:
    paths:
      - 'student-api/**'
  workflow_dispatch: {}   # manual trigger

permissions:
  contents: write
  pull-requests: read
  security-events: write

# =========================================================
# JOBS
# =========================================================
jobs:

  # =========================================================
  # 1️⃣ GITLEAKS — FAIL FAST ON SECRETS
  # =========================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 2️⃣ SEMGREP CE (OSS) — CODE SECURITY SCAN
  # =========================================================
  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest
    needs: gitleaks

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Run Semgrep CE Scan (JSON + MD)
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json

          echo "# Semgrep Security Report" > semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md
          echo "" >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

          jq -r '
            .results[]
            | "## \(.check_id)\n**Severity:** \(.extra.severity)\n**File:** \(.path):\(.start.line)\n\n\(.extra.message)\n"
          ' semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json \
            >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: |
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.json
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.md

  # =========================================================
  # 3️⃣ BUILD API → TEST → LINT
  # =========================================================
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    needs: semgrep

    defaults:
      run:
        working-directory: student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build API (venv + install deps)
        run: make build

      - name: Run tests (make test)
        run: make test

      - name: Code linting (make lint)
        run: make lint

  # =========================================================
  # 4️⃣ DOCKER LOGIN → BUILD → TRIVY SCAN → PUSH (GATED)
  # =========================================================
  docker-build-scan-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build-test-lint

    defaults:
      run:
        working-directory: student-api

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build locally first (no push) so Trivy can scan before anything ships
      - name: Build Docker Image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./student-api
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          version: v0.69.2
          image-ref: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          scanners: vuln
          format: table
          output: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt

      # Only pushes if Trivy passed (job would already have failed otherwise)
      - name: Push Docker Image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ./student-api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Print Summary
        if: success()
        run: |
          echo "Image pushed:"
          echo " - ${{ env.IMAGE }}:latest"
          echo " - ${{ env.IMAGE }}:${{ env.SHORT_SHA }}"
          echo "Security reports uploaded (Gitleaks + Semgrep + Trivy)"

  # =========================================================
  # 5️⃣ UPDATE GITOPS VALUES FILE (ArgoCD source of truth)
  #    Uses Go-based yq (mikefarah/yq) — a native YAML processor,
  #    NOT the Python/jq-wrapper yq. Go-yq edits the YAML AST
  #    directly, so comments, blank lines, and key order in
  #    values.yaml are preserved instead of being destroyed by
  #    a YAML→JSON→YAML round-trip.
  # =========================================================
  update-manifest:
    name: Bump image tag in Helm values
    runs-on: ubuntu-latest
    needs: docker-build-scan-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Pin a specific version rather than "latest" so the pipeline
      # doesn't silently break on an upstream yq release.
      - name: Install Go-based yq
        run: |
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Patch application.image.tag only
        env:
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          FILE=k8s/student-api/values.yaml

          # Path-based edit — targets .application.image.tag directly,
          # no line-range regex like the old sed version needed.
          yq -i '.application.image.tag = strenv(SHORT_SHA)' "$FILE"

          echo "Updated tag line:"
          yq '.application.image.tag' "$FILE"

      # Safety net: a clean tag bump should touch ~1 line (1 added,
      # 1 removed). If yq ever reflows comments/whitespace unexpectedly,
      # this fails the job instead of silently merging a noisy diff.
      - name: Verify only the tag line changed
        run: |
          FILE=k8s/student-api/values.yaml
          CHANGED_LINES=$(git diff --numstat "$FILE" | awk '{print $1+$2}')

          if [ -z "$CHANGED_LINES" ] || [ "$CHANGED_LINES" -eq 0 ]; then
            echo "::error::No changes detected in $FILE — patch may have failed silently."
            exit 1
          fi

          if [ "$CHANGED_LINES" -gt 2 ]; then
            echo "::error::Expected a ~2 line diff, got $CHANGED_LINES lines. Refusing to commit — check for comment/formatting loss."
            git diff "$FILE"
            exit 1
          fi

          echo "Diff size OK ($CHANGED_LINES lines changed)."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/student-api/values.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(student-api): bump image tag to ${SHORT_SHA} [skip ci]"
          git push