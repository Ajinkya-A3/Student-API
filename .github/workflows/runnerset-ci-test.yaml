name: student-api-ci-eks

on:
  workflow_dispatch: {}   # manual trigger

permissions:
  contents: write
  pull-requests: read
  security-events: write

# =========================================================
# JOBS
# =========================================================
jobs:

  # =========================================================
  # 1️⃣ GITLEAKS — FAIL FAST ON SECRETS
  # Needs: real `git` (fetch-depth: 0 needs full history — the
  # checkout-without-git REST fallback doesn't support this), and a
  # glibc base so the Node-based checkout/gitleaks-action JS actions run.
  # =========================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: arc-runner

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04   # ships git + node + glibc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Upload Gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: warn

  # =========================================================
  # 2️⃣ SEMGREP CE (OSS) — CODE SECURITY SCAN
  # Already had a job container — unchanged. semgrep/semgrep bundles
  # git + Python, so no extra tooling needed.
  # =========================================================
  semgrep:
    name: semgrep-oss/scan
    runs-on: arc-runner
    needs: gitleaks

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Run Semgrep CE Scan (JSON + MD)
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json

          echo "# Semgrep Security Report" > semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md
          echo "" >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

          jq -r '
            .results[]
            | "## \(.check_id)\n**Severity:** \(.extra.severity)\n**File:** \(.path):\(.start.line)\n\n\(.extra.message)\n"
          ' semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json \
            >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: |
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.json
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.md

  # =========================================================
  # 3️⃣ BUILD API → TEST → LINT (make-based, unchanged commands)
  # Needs: git, make/build-essential, and a glibc base for setup-python
  # to install its portable Python 3.14 build onto.
  # =========================================================
  build-test-lint:
    name: Build, Test & Lint
    runs-on: arc-runner
    needs: semgrep

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04   # ships git + make/build-essential

    defaults:
      run:
        working-directory: student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build API (venv + install deps)
        run: make build

      - name: Run tests (make test)
        run: make test

      - name: Code linting (make lint)
        run: make lint

  # =========================================================
  # 4️⃣ BUILD → TRIVY SCAN → PUSH (GATED) — dind runner
  # arc-runner-dind gives the job pod a real Docker daemon (DinD sidecar),
  # so we're back to the standard docker/build-push-action + trivy-action
  # flow — no Kaniko/crane workaround needed. Build local (load: true),
  # scan, then push only if Trivy exits clean.
  # =========================================================
  docker-build-scan-push:
    name: Docker Build, Scan & Push
    runs-on: arc-runner-dind
    needs: build-test-lint

    defaults:
      run:
        working-directory: student-api

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build locally first (no push) so Trivy can scan before anything ships
      - name: Build Docker Image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./student-api
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.34.0
        with:
          version: v0.69.2
          image-ref: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          scanners: vuln
          format: table
          output: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: student-api/trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt

      # Only pushes if Trivy passed (job would already have failed otherwise)
      - name: Push Docker Image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ./student-api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Print Summary
        if: success()
        run: |
          echo "Image pushed:"
          echo " - ${{ env.IMAGE }}:latest"
          echo " - ${{ env.IMAGE }}:${{ env.SHORT_SHA }}"
          echo "Security reports uploaded (Gitleaks + Semgrep + Trivy)"

  # =========================================================
  # 5️⃣ UPDATE GITOPS VALUES FILE (ArgoCD source of truth)
  # =========================================================
  update-manifest:
    name: Bump image tag in Helm values
    runs-on: arc-runner
    needs: docker-build-scan-push

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Patch application.image.tag only
        run: |
          FILE=k8s/student-api/values.yaml

          sed -i '/^application:/,/^config:/{
            s/^\(\s*tag: \)".*"/\1"'"${SHORT_SHA}"'"/
          }' "$FILE"

          echo "Updated tag line:"
          grep -A0 '^\s*tag: "'"${SHORT_SHA}"'"' "$FILE"

      - name: Commit and push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/student-api/values.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(student-api): bump image tag to ${SHORT_SHA} [skip ci]"
          git push