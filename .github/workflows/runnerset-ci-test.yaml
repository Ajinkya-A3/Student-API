name: student-api-ci-eks

on:
  push:
    branches:
      - main
    paths:
      - 'student-api/**'
  pull_request:
    paths:
      - 'student-api/**'
  workflow_dispatch: {}   # manual trigger

permissions:
  contents: write
  pull-requests: read
  security-events: write

# =========================================================
# JOBS
# =========================================================
jobs:

  # =========================================================
  # 1️⃣ GITLEAKS — FAIL FAST ON SECRETS
  # Needs: real `git` (fetch-depth: 0 needs full history — the
  # checkout-without-git REST fallback doesn't support this), and a
  # glibc base so the Node-based checkout/gitleaks-action JS actions run.
  # =========================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: eks-spot-amd

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04   # ships git + node + glibc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 2️⃣ SEMGREP CE (OSS) — CODE SECURITY SCAN
  # Already had a job container — unchanged. semgrep/semgrep bundles
  # git + Python, so no extra tooling needed.
  # =========================================================
  semgrep:
    name: semgrep-oss/scan
    runs-on: eks-spot-amd
    needs: gitleaks

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Run Semgrep CE Scan (JSON + MD)
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json

          echo "# Semgrep Security Report" > semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md
          echo "" >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

          jq -r '
            .results[]
            | "## \(.check_id)\n**Severity:** \(.extra.severity)\n**File:** \(.path):\(.start.line)\n\n\(.extra.message)\n"
          ' semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.json \
            >> semgrep-${REPO_NAME}-${BRANCH_NAME}-${SHORT_SHA}.md

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: |
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.json
            semgrep-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.md

  # =========================================================
  # 3️⃣ BUILD API → TEST → LINT (make-based, unchanged commands)
  # Needs: git, make/build-essential, and a glibc base for setup-python
  # to install its portable Python 3.14 build onto.
  # =========================================================
  build-test-lint:
    name: Build, Test & Lint
    runs-on: eks-spot-amd
    needs: semgrep

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04   # ships git + make/build-essential

    defaults:
      run:
        working-directory: student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build API (venv + install deps)
        run: make build

      - name: Run tests (make test)
        run: make test

      - name: Code linting (make lint)
        run: make lint

  # =========================================================
  # 4️⃣ BUILD → TRIVY SCAN → PUSH (GATED) — daemonless rewrite
  # kubernetes/kubernetes-novolume mode gives every job container its
  # own pod, but never a Docker daemon or --privileged access, so the
  # old docker/build-push-action + local `docker` CLI chain cannot work
  # here. Replaced with:
  #   - Kaniko: builds the image straight to an OCI tarball, no daemon,
  #     no privileged pod needed.
  #   - Trivy: scans the tarball directly (image never touches a
  #     registry or a daemon until it's proven clean).
  #   - crane: pushes the already-built tarball — also daemonless.
  # Each `uses: docker://...` step runs in its own pod under
  # kubernetes/kubernetes-novolume mode, sharing the same job work
  # volume, so the tarball built by Kaniko is visible to Trivy and crane
  # in later steps.
  #
  # NOTE: this is a genuine behavior change from the old job, not just
  # a container add — test it end to end before relying on it. crane
  # needs registry auth wired up (below via a config.json written to
  # the shared workspace); confirm the auth step actually produces a
  # config crane will read before trusting the push step in production.
  # =========================================================
  docker-build-scan-push:
    name: Build, Scan & Push (daemonless)
    runs-on: eks-spot-amd
    needs: build-test-lint

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04

    defaults:
      run:
        working-directory: student-api

    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/student-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Repo, Branch & Commit
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build image to tarball with Kaniko (no push)
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2
        with:
          args: >-
            --dockerfile=Dockerfile
            --context=dir:///github/workspace/student-api
            --no-push
            --tarPath=/github/workspace/student-api/image.tar
            --destination=${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Scan built tarball with Trivy
        uses: docker://aquasec/trivy:0.69.2
        with:
          args: >-
            image
            --input student-api/image.tar
            --scanners vuln
            --format table
            --output student-api/trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt
            --exit-code 1
            --ignore-unfixed
            --severity CRITICAL,HIGH

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}
          path: student-api/trivy-${{ env.REPO_NAME }}-${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}.txt

      # Auth for crane — writes a docker-style config.json into the shared
      # work volume so the later crane steps (each a separate pod) can read it.
      - name: crane auth login
        if: success()
        uses: docker://gcr.io/go-containerregistry/crane:debug
        env:
          DOCKER_CONFIG: /github/workspace/student-api/.docker
        with:
          entrypoint: crane
          args: >-
            auth login docker.io
            -u ${{ secrets.DOCKERHUB_USERNAME }}
            -p ${{ secrets.DOCKERHUB_TOKEN }}

      # Only pushes if Trivy passed (job would already have failed otherwise)
      - name: Push :sha tag
        if: success()
        uses: docker://gcr.io/go-containerregistry/crane:debug
        env:
          DOCKER_CONFIG: /github/workspace/student-api/.docker
        with:
          entrypoint: crane
          args: push student-api/image.tar ${{ env.IMAGE }}:${{ env.SHORT_SHA }}

      - name: Push :latest tag
        if: success()
        uses: docker://gcr.io/go-containerregistry/crane:debug
        env:
          DOCKER_CONFIG: /github/workspace/student-api/.docker
        with:
          entrypoint: crane
          args: push student-api/image.tar ${{ env.IMAGE }}:latest

      - name: Print Summary
        if: success()
        run: |
          echo "Image pushed:"
          echo " - ${{ env.IMAGE }}:latest"
          echo " - ${{ env.IMAGE }}:${{ env.SHORT_SHA }}"
          echo "Security reports uploaded (Gitleaks + Semgrep + Trivy)"

  # =========================================================
  # 5️⃣ UPDATE GITOPS VALUES FILE (ArgoCD source of truth)
  # Needs: git for commit/push — same reasoning as the gitleaks job.
  # =========================================================
  update-manifest:
    name: Bump image tag in Helm values
    runs-on: eks-spot-amd
    needs: docker-build-scan-push

    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Patch application.image.tag only
        run: |
          FILE=k8s/student-api/values.yaml

          sed -i '/^application:/,/^config:/{
            s/^\(\s*tag: \)".*"/\1"'"${SHORT_SHA}"'"/
          }' "$FILE"

          echo "Updated tag line:"
          grep -A0 '^\s*tag: "'"${SHORT_SHA}"'"' "$FILE"

      - name: Commit and push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/student-api/values.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(student-api): bump image tag to ${SHORT_SHA} [skip ci]"
          git push