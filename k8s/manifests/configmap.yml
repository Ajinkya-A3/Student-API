apiVersion: v1
kind: ConfigMap
metadata:
  name: student-api-config
  namespace: student-api
data:
  # postgres
  POSTGRES_DB: student_db
  POSTGRES_USER: postgres
  # student-api
  APP_NAME: "Student API"
  APP_VERSION: "1.0.0"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  DB_DRIVER: "postgresql+psycopg"
  DB_HOST: "postgres"          # matches the postgres headless Service name
  DB_PORT: "5432"
  DB_NAME: "student_db"
  DB_USER: "postgres"
