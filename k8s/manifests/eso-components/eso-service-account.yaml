---
# Source: student-api/templates/eso-components/eso-service-account.yaml
# The identity ESO presents to Vault's kubernetes auth backend.
# Referenced in the vault role above (bound_service_account_names)
# and in the ClusterSecretStore's serviceAccountRef below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: student-api
---
# Source: student-api/templates/eso-components/eso-service-account.yaml
# ESO's controller doesn't use this SA directly - it calls the
# TokenRequest API to mint a short-lived token *for* it. This Role
# grants that specific permission, scoped to just this one SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-token-creator
  namespace: student-api
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["eso-vault-auth"]
    verbs: ["create"]
---
# Source: student-api/templates/eso-components/eso-service-account.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-token-creator-binding
  namespace: student-api
subjects:
  - kind: ServiceAccount
    name: external-secrets          # ESO controller's own SA (helm release name, external-secrets ns)
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-token-creator
  apiGroup: rbac.authorization.k8s.io
