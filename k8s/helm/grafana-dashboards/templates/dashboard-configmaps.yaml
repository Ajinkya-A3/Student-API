{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ $name }}
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Observability"
data:
  {{ $name }}.json: |
{{ $.Files.Get $path | nindent 4 }}
---
{{- end }}
