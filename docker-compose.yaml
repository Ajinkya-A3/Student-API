version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: student-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./student-api
      dockerfile: Dockerfile

    container_name: student-api

    restart: unless-stopped

    environment:
      APP_NAME: Student API
      APP_VERSION: 1.0.0
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DB_DRIVER: postgresql+psycopg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: student_db
      DB_USER: postgres
      DB_PASSWORD: postgres

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # No curl/wget in the slim runtime image, so the healthcheck shells
      # out to the venv's own Python (already on PATH) and hits the app's
      # own liveness endpoint - no extra OS packages needed just for this.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: