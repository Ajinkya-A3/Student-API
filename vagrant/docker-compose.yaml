version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: student-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    image: at1asflame/student-api:c903951
    container_name: student-api-1
    restart: unless-stopped
    environment:
      APP_NAME: Student API
      APP_VERSION: 1.0.0
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DB_DRIVER: postgresql+psycopg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: student_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app2:
    image: at1asflame/student-api:c903951
    container_name: student-api-2
    restart: unless-stopped
    environment:
      APP_NAME: Student API
      APP_VERSION: 1.0.0
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      DB_DRIVER: postgresql+psycopg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: student_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: student-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  postgres_data:
